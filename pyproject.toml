[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "select-model-router"
version = "4.0.0"
description = "Conservative, evidence-aware model and reasoning-effort router"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Select Model contributors"}]
keywords = ["llm", "model-routing", "openai", "cost-optimization", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
select-model = "select_model.cli:main"


[tool.setuptools.packages.find]
include = ["select_model*"]

[tool.setuptools.package-data]
select_model = ["py.typed", "data/*.json"]
